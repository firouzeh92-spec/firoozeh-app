name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: npx @capacitor/assets generate --android
      - name: Fixed signing key
        env:
          KEY_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEY_B64" ]; then echo "KEYSTORE_BASE64 secret missing"; exit 1; fi
          echo "$KEY_B64" | base64 -d > android/app/firoozeh.jks
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          printf '\nandroid {\n  signingConfigs {\n    debug {\n      storeFile file("firoozeh.jks")\n      storePassword "Firoozeh1405"\n      keyAlias "firoozeh"\n      keyPassword "Firoozeh1405"\n    }\n  }\n}\n' >> android/app/build.gradle
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: {name: firoozeh-apk, path: android/app/build/outputs/apk/debug/app-debug.apk}
