<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--card:#fff;--pri:#1f6feb;--txt:#1b1f27;--mut:#6b7280;--bd:#e3e6ec;--ok:#16a34a;--bad:#dc2626}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Vazirmatn,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{background:var(--pri);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0;flex:1}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:6px 10px;cursor:pointer}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:46px;z-index:4}
nav button{white-space:nowrap;border:1px solid var(--bd);background:#fff;border-radius:20px;padding:7px 13px;cursor:pointer;font-family:inherit}
nav button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
main{max-width:900px;margin:0 auto;padding:12px}
.bar{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px}
input,select,textarea{font-family:inherit;font-size:14px;padding:8px;border:1px solid var(--bd);border-radius:8px;background:#fff;flex:1;min-width:120px}
textarea{width:100%;min-height:80px}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font-family:inherit}
.btn.g{background:#eef1f6;color:var(--txt)}.btn.r{background:var(--bad)}.btn.s{padding:5px 10px;font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tag{background:#eef1f6;border-radius:6px;padding:2px 8px;font-size:12px}
.tag.d{background:#e6f0ff;color:#1747a8}
.mut{color:var(--mut);font-size:12px}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.price{font-weight:bold;color:var(--ok)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:10px}
.modal.on{display:flex}
.box{background:#fff;border-radius:14px;padding:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.box h2{margin-top:0;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid .full{grid-column:1/-1}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}
#login{max-width:340px;margin:12vh auto;background:#fff;padding:20px;border-radius:14px;border:1px solid var(--bd)}
#login input{width:100%;margin-bottom:10px;display:block}
.err{color:var(--bad);font-size:13px;min-height:18px}
.empty{text-align:center;color:var(--mut);padding:30px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;display:none;z-index:50}
.hide{display:none!important}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
body{font-family:Vazirmatn,Tahoma,sans-serif;background:#eef2f8;font-size:15px;line-height:1.7}
header{background:linear-gradient(135deg,#1e4fd8,#3b82f6);box-shadow:0 2px 12px rgba(30,79,216,.25);padding:12px 16px}
header h1{font-size:19px;font-weight:800}
header button{font-family:inherit;font-weight:600;border-radius:10px;font-size:13px}
nav{padding:12px;gap:8px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
nav button{font-weight:700;font-size:14px;padding:9px 16px;border:1px solid #dbe3ef;box-shadow:0 1px 2px rgba(0,0,0,.04)}
nav button.on{box-shadow:0 4px 12px rgba(31,111,235,.35)}
.bar{border-radius:14px;padding:12px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
input,select,textarea{font-family:inherit;font-size:15px;border-radius:10px;padding:10px 12px;border:1px solid #d5dce8}
.btn{font-weight:700;border-radius:10px;padding:10px 16px;font-size:14px;box-shadow:0 2px 6px rgba(31,111,235,.25)}
.btn.s{padding:7px 12px;font-size:13px;box-shadow:none}
.card{border-radius:16px;padding:16px 18px;margin-bottom:14px;border:1px solid #e4e9f2;box-shadow:0 2px 10px rgba(15,23,42,.05);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,23,42,.1)}
.card h3{font-size:17px;font-weight:800;color:#0f172a;margin-bottom:8px}
.tags{gap:7px;margin:8px 0}
.tag{font-size:13px;font-weight:600;border-radius:8px;padding:4px 10px;background:#f1f4f9;color:#334155}
.tag.d{background:#dbeafe;color:#1e40af;font-weight:700}
.mut{font-size:13px;color:#64748b}
.price{font-size:19px;font-weight:800;color:#0f9d58}
.acts{gap:8px;margin-top:12px}
.acts .btn.g{background:#f1f4f9;color:#1e293b;box-shadow:none}
.acts a.btn{box-shadow:0 2px 6px rgba(22,163,74,.3);background:#16a34a}
.empty{font-size:16px;padding:50px 0}
#count{font-weight:700;color:#334155;font-size:14px}
.box{border-radius:18px;padding:20px}
.box h2{font-size:18px;font-weight:800}
#toast{font-size:14px;padding:10px 20px}

header{background:rgba(226,226,226,.97);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.12);padding:8px 14px;height:60px;color:#111}
header h1{color:#111;font-size:18px}
header .logo{height:46px;width:auto;display:block}
header button{background:#f4f4f4;color:#111;border:1px solid #bdbdbd;border-radius:10px;font-weight:700}
header button:hover{background:#fff;border-color:var(--gold)}
#who{color:var(--mut)!important}
nav{background:rgba(222,222,222,.97);border-bottom:1px solid #c8c8c8;top:60px;box-shadow:0 3px 8px rgba(0,0,0,.08)}
nav button{background:#f6f6f6;color:#111;border:1px solid #c4c4c4}
nav button.on{background:#2b2b2b;color:#fff;border-color:#2b2b2b}
.bar,.card,.box,#login{background:var(--panel)!important;border:1px solid #c9c9c9!important;color:var(--txt);box-shadow:0 4px 16px rgba(0,0,0,.10)!important}
.card:hover{border-color:var(--gold-soft)!important;box-shadow:0 6px 20px rgba(0,0,0,.16)!important}
.card h3,.box h2,#login h2{color:#000!important}
input,select,textarea{background:#fff!important;color:#111;border:1px solid #bdbdbd!important}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold)!important;box-shadow:0 0 0 3px rgba(184,150,62,.18)}
label,.mut{color:var(--mut)!important}
.btn{background:#2b2b2b;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.btn.g{background:#f0f0f0;color:#111;border:1px solid #bdbdbd;box-shadow:none}
.btn.r{background:#8b1e1e;color:#fff}
.acts a.btn{background:#2b2b2b;color:#fff;border:1px solid var(--gold-soft)}
.acts .btn.g{background:#f0f0f0;color:#111}
.tag{background:#ececec;color:#222;border:1px solid #cfcfcf}
.tag.d{background:#e3d9b8;color:#111;border:1px solid var(--gold-soft)}
.price{color:#111!important;font-size:20px}
#count{color:#111!important}
.empty{color:var(--mut)}
#toast{background:#2b2b2b;color:#fff;font-weight:700}
.err{color:#a11d1d}

<script>
var TOKEN = localStorage.getItem('fl_token') || '';
var ST = { user: null, files: [], saved: [], customers: [], settings: {}, tab: 'today', f: {} };
var TABS = [
  ['today','📅 امروز'],['sale','📁 فروش'],['rent','🏠 اجاره'],['budget','💰 بودجه'],
  ['area','📍 منطقه'],['search','🔍 جستجو'],['saved','💾 ذخیره‌ها'],['cust','👥 مشتریان']
];

/* ---------- ابزار ---------- */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function has(v){ // «ندارد» شامل «دارد» است؛ جدا بررسی می‌شود
  var t=nd(v||'').replace(/\u200c/g,' ').trim();
  if(!t||/ندارد|نیست|ندا?رد|^-+$|^–$|^خیر$|^نه$|^0$/.test(t))return false;
  return true;
}
function nd(s){ // نرمال‌سازی ارقام و حروف
  return String(s==null?'':s).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)})
    .replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)})
    .replace(/ي/g,'ی').replace(/ك/g,'ک').toLowerCase();
}
function num(s){var t=nd(s).replace(/[^\d.]/g,'');return t?parseFloat(t):0}
function fmt(n){return n?Number(n).toLocaleString('fa-IR'):'—'}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';setTimeout(function(){t.style.display='none'},2200)}
function closeM(id){$(id).classList.remove('on')}
function openM(id){$(id).classList.add('on')}
/* ===== لایه ارتباط با سرور + آفلاین (فقط این بخش به نسخه اندروید اضافه شده؛ منطق برنامه عوض نشده) ===== */
var API_URL='https://script.google.com/macros/s/AKfycbz2OAVSLIarW69UoKNnDVu2WhCCQONialWZIyXF2WGASG7GSAI0tkMgbzmNBSLuwkZe/exec'; // آدرس Web App (…/exec)
var QK='fl_queue',CK='fl_cache';
function jget(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function jset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function isNetErr(e){return e&&e.__net}
function rawCall(fn,args){
  var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort()},60000);
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),signal:ctl.signal,redirect:'follow'})
  .then(function(r){clearTimeout(tm);return r.json()},function(){clearTimeout(tm);var e=new Error('اتصال اینترنت برقرار نیست');e.__net=true;throw e})
  .then(function(j){if(!j.ok)throw new Error(j.error||'خطا');return j.result})
}
function tmpId(p){return p+'_tmp'+Date.now().toString(36)+Math.floor(Math.random()*1e4)}

function localApply(fn,a){
  var c=jget(CK,null);if(!c)throw new Error('اتصال اینترنت برقرار نیست');
  var u=c.user.username,now=new Date().toISOString(),res=true,i;

    var ex=c.saved.filter(function(s){return nd(s.Code)===nd(code)})[0];
    if(ex){ex.Status=st;ex.Note=nt;ex.UpdatedAt=now;res=ex}
    else{res={Username:u,Code:code,Status:st,Note:nt,SavedAt:now,UpdatedAt:now};c.saved.push(res)}
  }else if(fn==='api_unsaveItem'){
    c.saved=c.saved.filter(function(s){return nd(s.Code)!==nd(a[1])});
  }else if(fn==='api_addFile'){
    var f=a[1];
    if(!f||!String(f.Address||'').trim())throw new Error('آدرس الزامی است.');
    if(!String(f.DealType||'').trim())throw new Error('نوع معامله الزامی است.');
    var o={};Object.keys(f).forEach(function(k){o[k]=f[k]==null?'':String(f[k]).trim()});
    o.Code=tmpId('M');o.Source='دستی';o.AddedBy=u;c.files.push(o);res=o;
  }else if(fn==='api_deleteFile'){
    var fl=c.files.filter(function(x){return nd(x.Code)===nd(a[1])})[0];
    if(!fl)res=false;
    else{
      var mine=fl.Source==='دستی'&&sameU(fl.AddedBy,u);
      if(c.user.role!=='admin'&&!mine)throw new Error('فقط مدیر یا ثبت‌کننده می‌تواند حذف کند.');
      c.files=c.files.filter(function(x){return x!==fl});
    }
  }else if(fn==='api_saveCustomer'){
    var d=a[1];
    if(!d||!String(d.Name||'').trim())throw new Error('نام مشتری را وارد کنید.');
    var cl={Name:nd(d.Name),Phone:nd(d.Phone),Deal:d.Deal==='rent'?'rent':'sale',Areas:nd(d.Areas),Budget:cleanNum(d.Budget),Rent:cleanNum(d.Rent),Notes:nd(d.Notes)};
    var dt=function(s){var m=nd(s).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);return m?m[1]+'/'+('0'+m[2]).slice(-2)+'/'+('0'+m[3]).slice(-2):''};
    if(d.ID){
      var oc=c.customers.filter(function(x){return x.ID===d.ID})[0];
      if(!oc)throw new Error('مشتری پیدا نشد.');
      cl.CreatedAt=dt(d.Date)||oc.CreatedAt;cl.UpdatedAt=dt(d.Updated)||oc.UpdatedAt;
      for(var k in cl)oc[k]=cl[k];res=oc;
    }else{
      cl.CreatedAt=dt(d.Date);cl.UpdatedAt=dt(d.Updated);cl.ID=tmpId('c');cl.Username=u;cl.Log='[]';
      c.customers.unshift(cl);res=cl;
    }
  }else if(fn==='api_deleteCustomer'){
    c.customers=c.customers.filter(function(x){return x.ID!==a[1]});
  }else if(fn==='api_addCustomerLog'||fn==='api_deleteCustomerLog'){
    var cu=c.customers.filter(function(x){return x.ID===a[1]})[0];
    if(!cu)throw new Error('مشتری پیدا نشد.');
    var log=[];try{log=JSON.parse(cu.Log||'[]')}catch(e){}
    if(fn==='api_addCustomerLog'){
      if(!String(a[3]||'').trim())throw new Error('خلاصه مکالمه را بنویسید.');
      log.unshift({d:nd(a[2]),t:String(a[3]).slice(0,1000)});
    }else log.splice(Number(a[2]),1);
    cu.Log=JSON.stringify(log);res=cu;
  }
  jset(CK,c);
  return JSON.parse(JSON.stringify(res));
}
var QUEUED={api_saveItem:1,api_unsaveItem:1,api_addFile:1,api_deleteFile:1,api_saveCustomer:1,api_deleteCustomer:1,api_addCustomerLog:1,api_deleteCustomerLog:1};
var flushing=null;
function flushQueue(){
  if(flushing)return flushing;
  var q=jget(QK,[]);if(!q.length)return Promise.resolve(0);
  var map={},done=0;
  function remap(v){return typeof v==='string'&&map[v]?map[v]:v}
  function step(){
    q=jget(QK,[]);
    if(!q.length)return Promise.resolve();
    var op=q[0],args=op.args.map(remap);
    return rawCall(op.fn,args).then(function(r){
      if(op.tmp&&r){map[op.tmp]=r.Code||r.ID}
      q=jget(QK,[]);q.shift();jset(QK,q);done++;return step();
    },function(e){
      if(isNetErr(e)||String(e.message).indexOf('AUTH')>=0)throw e;
      q=jget(QK,[]);q.shift();jset(QK,q);toast('یک تغییر آفلاین ثبت نشد: '+e.message);return step(); // خطای منطقی سرور: همان پیام اصلی
    });
  }
  flushing=step().then(function(){flushing=null;return done},function(e){flushing=null;throw e});
  return flushing;
}
function call(fn){
  var args=Array.prototype.slice.call(arguments,1);
  function fail(e){
    var m=(e&&e.message)||String(e);
    if(m.indexOf('AUTH')>=0){logout();throw new Error('نشست منقضی شد')}
    throw new Error(m.replace(/^Error:\s*/,''));
  }
  if(fn==='api_bootstrap'){
    return flushQueue().then(function(){return rawCall(fn,args)}).then(function(d){jset(CK,d);return d},function(e){
      if(isNetErr(e)){var c=jget(CK,null);if(c){toast('حالت آفلاین');return c}}
      return fail(e);
    });
  }
  if(QUEUED[fn]){
    var q=jget(QK,[]);
    if(!q.length&&navigator.onLine!==false){
      return rawCall(fn,args).then(function(r){
        var c=jget(CK,null);if(c)refreshCacheSoon();return r;
      },function(e){if(isNetErr(e))return queueIt();return fail(e)});
    }
    return queueIt();
  }
  return rawCall(fn,args).catch(fail);
  function queueIt(){
    try{
      var r=localApply(fn,args),q=jget(QK,[]);
      var tmp=(fn==='api_addFile'||(fn==='api_saveCustomer'&&!args[1].ID))?(r.Code||r.ID):null;
      q.push({fn:fn,args:args,tmp:tmp});jset(QK,q);
      toast('آفلاین ذخیره شد؛ با اتصال ارسال می‌شود');
      return Promise.resolve(r);
    }catch(e){return Promise.reject(e)}
  }
}

  var p=new Intl.DateTimeFormat('fa-IR-u-nu-latn-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  var o={};p.forEach(function(x){o[x.type]=x.value});
  return o.year+'/'+o.month+'/'+o.day;
}

function match(f){
  var F=ST.f,t=ST.tab;
  if(t==='today'&&normDate(f.Date)!==todayJalali())return false;
  if(t==='sale'&&!isSale(f))return false;
  if(t==='rent'&&isSale(f))return false;
  if(F.deal==='sale'&&!isSale(f))return false;
  if(F.deal==='rent'&&isSale(f))return false;
  if(F.rooms&&num(f.Rooms)!==Number(F.rooms)&&!(F.rooms==='4'&&num(f.Rooms)>=4))return false;
  var a=num(f.Area);
  if(F.amin&&a<F.amin)return false;
  if(F.amax&&a>F.amax)return false;
  if(t==='budget'&&(F.pmin||F.pmax)){
    var p=isSale(f)?num(f.Price):num(f.Deposit);
    if(!p)return false;
    if(F.pmin&&p<F.pmin)return false;
    if(F.pmax&&p>F.pmax)return false;
  }
  if(F.q){
    var hay=(t==='area')?nd(f.Address):nd([f.Code,f.Address,f.Description,f.Owner,f.Mobile,f.PropertyType].join(' '));
    var words=F.q.split(/\s+/);
    for(var i=0;i<words.length;i++)if(hay.indexOf(words[i])<0)return false;
  }
  return true;
}

function areaList(c){return nd(c.Areas).split(/[,،\n]+/).map(function(s){return s.trim()}).filter(Boolean)}
function sepNum(el){var d=nd(el.value).replace(/\D/g,'');el.value=d?d.replace(/\B(?=(\d{3})+(?!\d))/g,','):''}
function custDealUi(){
  var r=$('c_Deal').value==='rent';
  $('c_RentBox').classList.toggle('hide',!r);
  $('c_BLabel').textContent=r?'ودیعه / رهن (تومان)':'بودجه خرید (تومان)';
}
function openCust(id){
  var c=id?getCust(id):{};CUR=id||null;
  $('cTitle').textContent=id?'ویرایش مشتری':'مشتری جدید';
  ['Name','Phone','Areas','Budget','Rent','Notes'].forEach(function(k){$('c_'+k).value=c[k]||''});
  sepNum($('c_Budget'));sepNum($('c_Rent'));
  var cd=id?normDate(c.CreatedAt):'';$('c_Date').value=(cd&&cd<'1700')?cd:todayJalali();
  $('c_Deal').value=c.Deal||'sale';custDealUi();$('cerr').textContent='';
  closeM('mCDet');openM('mCust');
}
function saveCust(){
  var c={ID:CUR||'',Deal:$('c_Deal').value,Date:$('c_Date').value,Updated:todayJalali()};
  ['Name','Phone','Areas','Budget','Rent','Notes'].forEach(function(k){c[k]=$('c_'+k).value});
  call('api_saveCustomer',TOKEN,c).then(function(r){
    var i=ST.customers.map(function(x){return x.ID}).indexOf(r.ID);
    if(i>=0)ST.customers[i]=r;else ST.customers.unshift(r);
    closeM('mCust');renderList();toast('ذخیره شد');
  }).catch(function(e){$('cerr').textContent=e.message});
}
function delCust(id){
  if(!confirm('این مشتری حذف شود؟'))return;
  call('api_deleteCustomer',TOKEN,id).then(function(){ST.customers=ST.customers.filter(function(c){return c.ID!==id});closeM('mCDet');renderList()}).catch(function(e){toast(e.message)});
}
function renderCust(){
  var F=ST.f,q=F.q||'';
  var items=ST.customers.filter(function(c){
    if(F.deal&&c.Deal!==F.deal)return false;
    if(q){var hay=nd([c.Name,c.Phone,c.Areas,c.Notes].join(' '));
      var w=q.split(/\s+/);for(var i=0;i<w.length;i++)if(hay.indexOf(w[i])<0)return false}
    return true;
  });
  $('count').textContent=items.length+' مشتری';
  if(!items.length){$('list').innerHTML='<div class="empty">مشتری ثبت نشده است</div>';return}
  $('list').innerHTML=items.map(function(c){
    var sale=c.Deal!=='rent',tags=[];
    if(c.Budget)tags.push((sale?'بودجه ':'ودیعه ')+fmt(num(c.Budget)));
    if(!sale&&c.Rent)tags.push('اجاره '+fmt(num(c.Rent)));
    var log=[];try{log=JSON.parse(c.Log||'[]')}catch(e){}
    var own=ST.user.role==='admin'&&c.Username!==ST.user.username?' | '+esc(c.Username):'';
    return '<div class="card" onclick="showCust(\''+c.ID+'\')"><h3>'+esc(c.Name)+'</h3>'+
      '<div class="tags"><span class="tag d">'+(sale?'خریدار':'مستأجر')+'</span>'+
      areaList(c).map(function(a){return '<span class="tag">📍 '+esc(a)+'</span>'}).join('')+
      tags.map(function(t){return '<span class="tag">'+t+'</span>'}).join('')+'</div>'+
      '<div class="mut">'+(c.Phone?esc(fixMob(c.Phone)):'')+(log.length?' | آخرین تماس: '+esc(log[0].d):'')+own+'</div>'+
      '<div class="acts" onclick="event.stopPropagation()">'+(c.Phone?'<a class="btn s" href="tel:'+fixMob(c.Phone)+'" style="text-decoration:none">📞 تماس</a>':'')+
      '<button class="btn g s" onclick="showCust(\''+c.ID+'\')">📋 جزئیات و فایل‌های مناسب</button></div></div>';
  }).join('');
}
var TOL=0.15;
function inTol(v,b){return v&&b&&v>=b*(1-TOL)&&v<=b*(1+TOL)}
function custMatches(c){
  var sale=c.Deal!=='rent',b=num(c.Budget),r=num(c.Rent),areas=areaList(c),out=[];
  ST.files.forEach(function(f){
    if(isSale(f)!==sale)return;
    var score=0;
    if(areas.length){
      var ad=nd(f.Address),hit=areas.some(function(a){return ad.indexOf(a)>=0});
      if(!hit)return;
    }
    if(b){var p=sale?num(f.Price):num(f.Deposit);if(!inTol(p,b))return;score+=Math.abs(p-b)/b}
    if(!sale&&r){var rr=num(f.Rent);if(!inTol(rr,r))return;score+=Math.abs(rr-r)/r}
    if(!areas.length&&!b&&!(r&&!sale))return;
    out.push({f:f,s:score});
  });
  out.sort(function(a,b){return a.s-b.s});
  return out.map(function(x){return x.f});
}
function showCust(id){
  var c=getCust(id);if(!c)return;CUR=id;
  var log=[];try{log=JSON.parse(c.Log||'[]')}catch(e){}
  var sale=c.Deal!=='rent',m=custMatches(c),sm=savedMap();
  $('cdBody').innerHTML='<h2>'+esc(c.Name)+' <span class="tag d">'+(sale?'خریدار':'مستأجر')+'</span></h2>'+
    '<div class="tags">'+areaList(c).map(function(a){return '<span class="tag">📍 '+esc(a)+'</span>'}).join('')+
    (c.Budget?'<span class="tag">'+(sale?'بودجه ':'ودیعه ')+fmt(num(c.Budget))+'</span>':'')+
    (!sale&&c.Rent?'<span class="tag">اجاره '+fmt(num(c.Rent))+'</span>':'')+'</div>'+
    (c.Phone?'<div>📞 '+esc(fixMob(c.Phone))+'</div>':'')+
    (c.Notes?'<div class="mut">'+esc(c.Notes)+'</div>':'')+
    '<div class="acts"><button class="btn s" onclick="openCust(\''+id+'\')">✏️ ویرایش</button><button class="btn g s" onclick="delCust(\''+id+'\')">🗑 حذف</button></div>'+
    '<h2 style="margin-top:16px">📞 سابقه تماس‌ها</h2>'+
    '<div class="grid"><div><label>تاریخ</label><input id="lg_d" value="'+todayJalali()+'"></div>'+
    '<div class="full"><label>خلاصه مکالمه</label><textarea id="lg_t"></textarea></div></div>'+
    '<div class="acts"><button class="btn s" onclick="addLog()">افزودن به سابقه</button></div><div class="err" id="lgerr"></div>'+
    (log.length?log.map(function(l,i){return '<div class="card" style="padding:10px 14px;margin-bottom:8px"><span class="tag d">'+esc(l.d)+'</span> '+esc(l.t)+
      ' <button class="btn g s" onclick="delLog('+i+')">🗑</button></div>'}).join(''):'<div class="mut">هنوز تماسی ثبت نشده.</div>')+
    '<h2 style="margin-top:16px">🔎 فایل‌های مناسب ('+m.length+') <span class="mut">(با حدود ±۱۵٪ قیمت)</span></h2>'+
    (m.length?m.slice(0,30).map(function(f){return card(f,sm[nd(f.Code)])}).join(''):'<div class="mut">فایل مناسبی پیدا نشد.</div>');
  openM('mCDet');
}
function addLog(){
  call('api_addCustomerLog',TOKEN,CUR,$('lg_d').value,$('lg_t').value).then(function(r){
    ST.customers[ST.customers.map(function(x){return x.ID}).indexOf(r.ID)]=r;showCust(r.ID);renderList();
  }).catch(function(e){$('lgerr').textContent=e.message});
}
function delLog(i){
  if(!confirm('این مورد حذف شود؟'))return;
  call('api_deleteCustomerLog',TOKEN,CUR,i).then(function(r){
    ST.customers[ST.customers.map(function(x){return x.ID}).indexOf(r.ID)]=r;showCust(r.ID);renderList();
  }).catch(function(e){toast(e.message)});
}

/* ---------- آگهی دیوار ---------- */
function makeAd(code){
  var f=getFile(code);if(!f)return;
  var sale=isSale(f),L=['مشاورین املاک فیروزه،شهرک غرب،نبش شریعتی 45',''];
  L.push((sale?'فروش ':'رهن و اجاره ')+(f.PropertyType||'ملک')+(f.Area?' '+f.Area+' متر':'')+(f.Rooms?' '+f.Rooms+' خواب':''));
  L.push('');
  var adr=String(f.Address||'').replace(/\s*[-–—،,]?\s*(پلاک|پ)\s*[:.]?\s*[\d۰-۹٠-٩]+.*$/,'').trim();if(adr)L.push('📍 موقعیت: '+adr);
  if(f.Area)L.push('📐 متراژ: '+f.Area+' متر');
  if(f.Rooms)L.push('🛏 تعداد خواب: '+f.Rooms);
  if(f.Floor)L.push('🏢 طبقه: '+f.Floor+(f.TotalFloors?' از '+f.TotalFloors:''));
  if(f.Age)L.push('🏗 سن بنا: '+f.Age);
  if(f.Direction)L.push('🧭 جهت: '+f.Direction);
  if(has(f.Parking))L.push('🚗 پارکینگ: '+f.Parking);
  if(has(f.Elevator))L.push('🛗 آسانسور: '+f.Elevator);
  if(f.Flooring)L.push('کف: '+f.Flooring);
  if(f.Cabinet)L.push('کابینت: '+f.Cabinet);
  if(f.Cooler)L.push('سرمایش/گرمایش: '+f.Cooler);
  L.push('');
  if(sale)L.push('💰 قیمت: '+fmt(num(f.Price))+' تومان');
  else{L.push('💰 ودیعه: '+fmt(num(f.Deposit))+' تومان');L.push('💰 اجاره ماهانه: '+fmt(num(f.Rent))+' تومان')}
    L.push('');L.push('برای بازدید و اطلاعات بیشتر تماس بگیرید');L.push('آدرس دفتر:شهرک غرب نبش شریعتی 45');L.push('مشاورین املاک فیروزه');
  $('adText').value=L.join('\n').replace(/\n{3,}/g,'\n\n').trim();
  openM('mAd');
}
function copyAd(){
  var t=$('adText');t.select();
  (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).catch(function(){document.execCommand('copy')}).then(function(){toast('کپی شد')});
}

/* ---------- مدیریت ---------- */
function openAdmin(){
  $('sigText').value=ST.settings.adSignature||'';$('admErr').textContent='';
  call('api_listUsers',TOKEN).then(drawUsers).catch(function(e){$('admErr').textContent=e.message});
  openM('mAdmin');
}
function drawUsers(list){
  $('userList').innerHTML=list.map(function(u){
    return '<div class="tags"><span class="tag d">'+esc(u.Username)+'</span><span>'+esc(u.DisplayName)+'</span><span class="tag">'+(u.Role==='admin'?'مدیر':'مشاور')+'</span>'+
      '<button class="btn g s" onclick="toggleUser(\''+esc(u.Username)+'\','+(!u.Active)+',\''+esc(u.DisplayName)+'\',\''+esc(u.Role)+'\')">'+(u.Active?'غیرفعال کن':'فعال کن')+'</button></div>';
  }).join('');
}
function saveUser(){
  var u={username:$('u_user').value.trim(),name:$('u_name').value.trim(),password:$('u_pass').value,role:$('u_role').value,active:true};
  call('api_saveUser',TOKEN,u).then(function(l){drawUsers(l);$('u_pass').value='';toast('ثبت شد')}).catch(function(e){$('admErr').textContent=e.message});
}
function toggleUser(un,active,name,role){
  call('api_saveUser',TOKEN,{username:un,name:name,role:role,active:active}).then(drawUsers).catch(function(e){$('admErr').textContent=e.message});
}
function saveSig(){call('api_setSignature',TOKEN,$('sigText').value).then(function(){ST.settings.adSignature=$('sigText').value;toast('ذخیره شد')}).catch(function(e){$('admErr').textContent=e.message})}
function dedupe(){call('api_removeDuplicates',TOKEN).then(function(n){toast(n+' تکراری حذف شد');start()}).catch(function(e){$('admErr').textContent=e.message})}
